[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-source-studio"
version = "0.1.0"
description = "Local master sourcing database for multi-store Shopify operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "1976haru"}]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["nicegui>=2.19,<4"]
similarity = ["rapidfuzz>=3.9"]
nlp = ["keybert>=0.9", "sentence-transformers>=3.0"]
credentials = ["keyring>=25"]

[project.scripts]
shopsource = "shopsource.cli:main"
shopsource-gui = "shopsource.ui.app:main"
shopsource-ui-v2 = "shopsource.ui.v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
